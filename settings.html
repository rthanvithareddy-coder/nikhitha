<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkPulse – Settings</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/main.js"></script>
    <script defer src="js/settings.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="logo">LinkPulse</div>
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="monitor.html">Monitor</a></li>
                <li><a href="prediction.html">Prediction</a></li>
                <li><a href="recovery.html">Recovery</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="settings.html" class="active">Settings</a></li>
            </ul>
        </nav>
    </div>
    <main class="content">
        <header>
            <h1>Settings</h1>
        </header>
        <section class="cards">
            <div class="card">
                <h2>Refresh Interval</h2>
                <label for="refresh-interval">Seconds:</label>
                <input type="number" id="refresh-interval" min="1" value="5" />
            </div>
            <div class="card">
                <h2>Theme</h2>
                <select id="theme-select">
                    <option value="dark" selected>Dark Navy</option>
                    <option value="light">Light</option>
                </select>
            </div>
            <div class="card">
                <h2>Export Data</h2>
                <button id="export-btn">Download CSV</button>
            </div>
        </section>
    </main>
</body>
</html>
